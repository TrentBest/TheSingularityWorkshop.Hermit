name: Hermit embodied reach conformance

on:
  push:
    branches: [development]
    paths:
      - "integration/embodied-reach/**"
      - "docs/EMBODIED_REACH_ADAPTER.md"
      - ".github/workflows/embodied-reach.yml"
  pull_request:
    branches: [development]
    paths:
      - "integration/embodied-reach/**"
      - "docs/EMBODIED_REACH_ADAPTER.md"
      - ".github/workflows/embodied-reach.yml"

permissions:
  contents: read

jobs:
  embodied-reach:
    name: .NET 10 consumer conformance
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hermit
        uses: actions/checkout@v4

      - name: Check out pinned Gestures source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.Gestures
          ref: 8ee61dc6bf07cc5dca072d6e7b91601ae9e807e8
          path: integration/dependencies/Gestures

      - name: Check out pinned NeuralNetworks source
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_NeuralNetworks
          ref: 5b8c9163c8f33e3d5c26940942d96cb9316b9e2c
          path: integration/dependencies/NeuralNetworks

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and run conformance tests
        run: dotnet test integration/embodied-reach/Hermit.EmbodiedReach.Tests.csproj --configuration Release
