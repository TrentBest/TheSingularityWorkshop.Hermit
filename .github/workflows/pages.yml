name: Build and deploy Hermit showcase

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermit-pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble and verify the Hermit learning experience
    runs-on: ubuntu-latest
    steps:
      - name: Check out Hermit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned commit SHA

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned commit SHA
        with:
          node-version: 22

      - name: Verify the runtime, playground, and learning modules
        run: |
          npm test
          node examples/deterministic-inspection.mjs

      - name: Assemble the static Hermit showcase and documentation
        shell: bash
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          cp -R src _site/src
          cp -R docs _site/docs
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/src/hermit-playground.js
          test -s _site/src/hermit-runtime.js
          test -s _site/assets/hermit-playground.js
          test -s _site/assets/neural-network-demo.js
          test -s _site/assets/neural-network.js
          test -s _site/assets/hermit-voice.js
          test -s _site/src/voice.js
          test -s _site/docs/VOICE_INTERACTION.md
          test -s _site/docs/ROADMAP.md
          test -s _site/docs/PAGES_EXPERIENCE.md
          grep -F '<script type="module" src="./assets/hermit-playground.js"></script>' _site/index.html
          grep -F '<script type="module" src="./assets/neural-network-demo.js"></script>' _site/index.html
          grep -F '<script type="module" src="./assets/hermit-voice.js"></script>' _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # pinned commit SHA
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the Hermit showcase
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # pinned commit SHA
